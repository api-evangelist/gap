x-coverage:
  state: none
  reason: no-developer-program
  detail: >-
    Gap Inc. provisioned an Apigee developer portal at developer.gap.com — the DNS still
    CNAMEs to gap-api-docs-portal.apigee.net — but the service behind it is gone, its TLS
    certificate covers only *.apigee.net, and the Apigee runtime at api.gap.com answers every
    anonymous path with "Unable to identify proxy for host", so there is no public API, spec,
    portal or SDK to read anywhere on the estate.
  evidence:
    - url: https://developer.gap.com/
      status: 0
    - url: https://gap-api-docs-portal.apigee.net/
      status: 404
    - url: https://api.gap.com/openapi.json
      status: 404
    - url: https://www.gap.com/.well-known/api-catalog
      status: 404
  checked: '2026-09-10'
