aid: gap
name: Gap
description: >-
  Gap Inc. is a Fortune 500 American clothing and accessories retailer operating the Gap,
  Old Navy, Banana Republic and Athleta brands. Gap Inc. publishes no public developer API,
  no machine-readable contract and no developer portal: probing found an Apigee gateway at
  api.gap.com that exposes no proxy to an anonymous caller, and a dangling developer-portal
  CNAME at developer.gap.com (gap-api-docs-portal.apigee.net) whose service is gone and whose
  TLS certificate does not cover the hostname. What Gap does publish is a HackerOne
  vulnerability disclosure programme and one first-party open-source Android HTTP library.
  This repository is an independent third-party profile of that public surface.
